# Replaces /etc/nginx/conf.d/default.conf of nginx:alpine.
# Based on the stock nginx:alpine default config with security and redirect hardening.
# MIME types, caching and 404 behaviour are inherited from the stock image.
server {
    listen       80;
    server_name  localhost;

    # The container sits behind a TLS-terminating proxy (Cloudflare + host nginx),
    # so it only ever sees plain HTTP on port 80. Without this, the directory
    # redirect "/products" -> "/products/" is sent as an absolute
    # "http://<host>/products/" URL and downgrades visitors from HTTPS.
    # With it, nginx sends the relative "Location: /products/".
    absolute_redirect off;

    # Never serve dotfiles/dot-directories (e.g. .git, .env, .image-slots.state.json),
    # except /.well-known/ (ACME, security.txt). Defence in depth on top of .dockerignore.
    location ~ /\.(?!well-known) {
        return 404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
