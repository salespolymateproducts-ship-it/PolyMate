name: Deploy to EC2

# สั่งให้ทำงานทุกครั้งที่มีการ Push โค้ดเข้าสาขา main
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. ดึงโค้ดล่าสุดจาก GitHub มาที่เซิร์ฟเวอร์จำลอง
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. ล็อกอินเข้า Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build -t polymatepd/my-html-web:latest .
        docker push polymatepd/my-html-web:latest

    # 4. รีโมทเข้าไปที่ EC2 เพื่อสั่งรัน Docker Compose ใหม่
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # อัปเดต Image ใหม่จาก Docker Hub
          sudo docker pull polymatepd/my-html-web:latest
          
          # รีสตาร์ท Container เพื่อใช้ Image ตัวใหม่ (รันอยู่เบื้องหลัง)
          sudo docker-compose up -d --force-recreate
